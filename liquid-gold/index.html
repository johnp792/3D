/* Plate wow: the real Meniscus engine, run once, carrying two brands.
 * Copied from plate-options/wow/_shared/liquid.js; the only change is parallel shader compilation.
 *
 * The solver, the plate and the glass composite are the Meniscus pack's own
 * (Stable Fluids, Stam 1999, WebGL2 ping-pong; see D:/modpack/site/examples/
 * meniscus/meniscus.js). What is added here:
 *   - two brand layers (type + grade) under ONE liquid surface, so the two
 *     sites line up to the pixel at every moment, because they share the fluid
 *   - a paint mask that says which brand is showing where. It is stamped by the
 *     host, grows along the liquid's own flow, can be flooded, and can be fed by
 *     a second dye channel so a pour carries the new brand in with it
 *   - the boundary between the brands refracts, like the edge of a liquid
 *   - the Meniscus opening section laid out in canvas from its CSS rules
 * The engine renders the finished site into an FBO; the host composites it.
 */
(function () {
  'use strict';

  var VERT = [
    '#version 300 es',
    'precision highp float;',
    'in vec2 aPos;',
    'out vec2 vUv; out vec2 vL; out vec2 vR; out vec2 vT; out vec2 vB;',
    'uniform vec2 uTexel;',
    'void main(){',
    '  vUv = aPos * 0.5 + 0.5;',
    '  vL = vUv - vec2(uTexel.x, 0.0);',
    '  vR = vUv + vec2(uTexel.x, 0.0);',
    '  vT = vUv + vec2(0.0, uTexel.y);',
    '  vB = vUv - vec2(0.0, uTexel.y);',
    '  gl_Position = vec4(aPos, 0.0, 1.0);',
    '}'
  ].join('\n');

  var HEAD = [
    '#version 300 es',
    'precision highp float; precision highp sampler2D;',
    'in vec2 vUv; in vec2 vL; in vec2 vR; in vec2 vT; in vec2 vB;',
    'out vec4 frag;',
    ''
  ].join('\n');

  var NOISE = [
    'float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453123); }',
    'float noise(vec2 p){',
    '  vec2 i = floor(p), f = fract(p);',
    '  vec2 u = f * f * (3.0 - 2.0 * f);',
    '  return mix(mix(hash(i), hash(i + vec2(1.0, 0.0)), u.x),',
    '             mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), u.x), u.y);',
    '}',
    ''
  ].join('\n');

  var SRC = {};
  SRC.advect = HEAD + [
    'uniform sampler2D uVelocity, uSource;',
    'uniform vec2 uTexel; uniform float dt, dissipation;',
    'void main(){',
    '  vec2 vel = texture(uVelocity, vUv).xy;',
    '  vec2 coord = vUv - dt * vel * uTexel;',
    '  frag = dissipation * texture(uSource, coord);',
    '  frag.a = 1.0;',
    '}'].join('\n');
  SRC.divergence = HEAD + [
    'uniform sampler2D uVelocity;',
    'void main(){',
    '  float L = texture(uVelocity, vL).x;',
    '  float R = texture(uVelocity, vR).x;',
    '  float T = texture(uVelocity, vT).y;',
    '  float B = texture(uVelocity, vB).y;',
    '  vec2 Cc = texture(uVelocity, vUv).xy;',
    '  if (vL.x < 0.0) L = -Cc.x;',
    '  if (vR.x > 1.0) R = -Cc.x;',
    '  if (vT.y > 1.0) T = -Cc.y;',
    '  if (vB.y < 0.0) B = -Cc.y;',
    '  frag = vec4(0.5 * (R - L + T - B), 0.0, 0.0, 1.0);',
    '}'].join('\n');

    'uniform sampler2D uVelocity;',
    'void main(){',
    '  float L = texture(uVelocity, vL).y;',
    '  float R = texture(uVelocity, vR).y;',
    '  float T = texture(uVelocity, vT).x;',
    '  float B = texture(uVelocity, vB).x;',
    '  frag = vec4(0.5 * ((R - L) - (T - B)), 0.0, 0.0, 1.0);',
    '}'].join('\n');

    'uniform float curl, dt;',
    'void main(){',
    '  float L = texture(uCurl, vL).x;',
    '  float R = texture(uCurl, vR).x;',
    '  float T = texture(uCurl, vT).x;',
    '  float B = texture(uCurl, vB).x;',
    '  float Cc = texture(uCurl, vUv).x;',
    '  vec2 force = 0.5 * vec2(abs(T) - abs(B), abs(R) - abs(L));',
    '  force /= length(force) + 0.0001;',
    '  force *= curl * Cc;',
    '  force.y *= -1.0;',
    '  vec2 vel = texture(uVelocity, vUv).xy + force * dt;',
    '  frag = vec4(clamp(vel, -1200.0, 1200.0), 0.0, 1.0);',
    '}'].join('\n');
  SRC.pressure = HEAD + [
    'uniform sampler2D uPressure, uDivergence;',
    'void main(){',
    '  float L = texture(uPressure, vL).x;',
    '  float R = texture(uPressure, vR).x;',
    '  float T = texture(uPressure, vT).x;',
    '  float B = texture(uPressure, vB).x;',
    '  float div = texture(uDivergence, vUv).x;',
    '  frag = vec4((L + R + T + B - div) * 0.25, 0.0, 0.0, 1.0);',

    'uniform sampler2D uPressure, uVelocity;',
    'void main(){',

    '  float ht = texture(uDye, vT).x;',
    '  float hb = texture(uDye, vB).x;',

function frame(now){raf=0;if(paused||document.hidden)return;let dt=Math.max(.001,Math.min((now-last)/1000,1/30));last=now;clock+=dt;
 if(st.wave){st.wave.t+=dt;if(st.wave.t>=WAVE.spread+WAVE.dur){cur=next;next=null;Lq.promote();Lq.clearMask();st.wave=null;if(queued){const q=queued;queued=null;applyText(q)}}}
 if(ptr.px>=0&&now-ptr.last<90){Lq.stir(ptr.px/W,1-ptr.py/H,ptr.x/W,1-ptr.y/H,1);ptr.px=ptr.x;ptr.py=ptr.y;}
 else if(!reduced&&now-ptr.last>1400){const ix=.55+Math.cos(clock*.37)*.30+Math.cos(clock*.91)*.09,iy=.60+Math.sin(clock*.29)*.21+Math.sin(clock*.77)*.07;if(idle)Lq.stir(idle[0],idle[1],ix,iy,.7);idle=[ix,iy];}
 Lq.step(dt);renderOnce();if(!reduced||st.wave||now-ptr.last<1600||clock<2)raf=requestAnimationFrame(frame);
}
function run(){if(ready&&Lq&&!paused&&!document.hidden&&!raf){last=performance.now();raf=requestAnimationFrame(frame)}}
canvas.addEventListener('pointermove',e=>{const r=canvas.getBoundingClientRect();const x=e.clientX-r.left,y=e.clientY-r.top;if(performance.now()-ptr.last>200){ptr.px=x;ptr.py=y}ptr.x=x;ptr.y=y;ptr.last=performance.now();idle=null;run()});
canvas.addEventListener('pointerleave',()=>{ptr.px=-1;idle=null});
canvas.addEventListener('pointerdown',e=>{if(!ready||!Lq)return;const r=canvas.getBoundingClientRect();Lq.splat((e.clientX-r.left)/W,1-(e.clientY-r.top)/H,0,-260,.2,.006);ptr.last=performance.now();run()});
$('editor').addEventListener('submit',e=>{e.preventDefault();applyText({brand:$('brand').value,headline:$('headline').value,lede:$('description').value,grade:$('grade').value})});
// Original wow.js name rebranding: balanced headline, hashed color grade,
// and the existing BLIT shader's tile-flip wave starting nearest the send button.
function rebrand(){
 const name=$('brand').value.replace(/\s+/g,' ').trim();if(!name){$('brand').focus();return;}
 let lines,grade;
 if(name.toLowerCase().replace(/\s/g,'')==='threedrops'){lines=['Gold that','still runs.'];grade='gold';}
 else{const words=name.split(' ');let split=1,best=Infinity;
 for(let i=1;i<words.length;i++){const d=Math.abs(words.slice(0,i).join(' ').length-words.slice(i).join(' ').length);if(d<best){best=d;split=i}}
 lines=words.length===1?[name]:[words.slice(0,split).join(' '),words.slice(split).join(' ')];
 if(!/[.!?]$/.test(lines[lines.length-1]))lines[lines.length-1]+='.';
 let hash=2166136261;for(const c of name.toLowerCase()){hash^=c.charCodeAt(0);hash=Math.imul(hash,16777619)}
 const palette=['gold','warm','sage','glass'];let i=(hash>>>0)%palette.length;grade=palette[i];
 for(let n=0;n<palette.length&&Math.hypot(...grades[grade].tint.map((v,k)=>v-cur.tint[k]))<=.2;n++)grade=palette[(i+n+1)%palette.length];
 }
 $('headline').value=lines.join('\n');$('grade').value=grade;
 $('rebrand').classList.add('press');setTimeout(()=>$('rebrand').classList.remove('press'),160);
 applyText({brand:name,headline:lines,lede:$('description').value,grade});
}
$('rebrand').onclick=rebrand;
$('brand').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();rebrand()}});
$('pour').onclick=()=>{if(ready&&Lq){Lq.pour(Math.round(Math.random()*10000));ptr.last=performance.now();run()}};
$('pause').onclick=()=>{paused=!paused;$('pause').textContent=paused?'Resume':'Pause';$('pause').setAttribute('aria-pressed',String(paused));run()};
let rt;new ResizeObserver(()=>{clearTimeout(rt);rt=setTimeout(()=>{if(ready){setup();renderOnce();run()}},120)}).observe(canvas.parentElement);
document.addEventListener('visibilitychange',run);
canvas.addEventListener('webglcontextlost',e=>{e.preventDefault();paused=true;status.textContent='Graphics context lost. Reload this file to restart.'});
await PS.loadFonts(['500 100px Geist','400 16px Geist','500 60px "Bodoni Moda"','400 14px Archivo'],3000);
if(Lq)await new Promise(resolve=>{function check(){if(Lq.compiled())resolve();else requestAnimationFrame(check)}check()});
setup();ready=true;if(Lq){renderOnce();status.textContent='Move across the canvas to pour.';run()}
// Public editing API. Strings are painted on a canvas; no HTML is executed.
window.liquidGold={setText:applyText,pour:()=>{if(Lq){Lq.pour(7);ptr.last=performance.now();run()}},getText:()=>structuredClone(next||cur)};
if(queued){const q=queued;queued=null;applyText(q)}
})();
